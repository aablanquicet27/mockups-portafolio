:root{
  /* Layout: barra lateral noche + lienzo claro. Violeta = acción. Coral = solo "simular" y estado en vivo. */
  color-scheme: light;
  --noche:#170D26;
  --violeta:#5C11C5;
  --lila:#DED0ED;
  --coral:#FF7A59;
  --papel:#F5F2F9;
  --blanco:#FFFFFF;
  --tinta:#1D1530;
  --gris:#655E78;
  --linea:#E2DAEE;
  --ok:#1B7446;
  --aviso:#8A5800;
  --ciip:#0E8A7A;
  --geo:#C2630C;
  --bio:#3559C7;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --texto:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --curva:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--papel);color:var(--tinta);font:14px/1.45 var(--texto);display:grid;grid-template-columns:228px minmax(0,1fr)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--violeta);outline-offset:2px}
.side :focus-visible{outline-color:var(--coral)}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
h2{font-size:22px;font-weight:700}
h3{font-size:15px;font-weight:700}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
svg.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Barra lateral */
.side{background:var(--noche);color:#EDE6F7;display:flex;flex-direction:column;gap:18px;padding:18px 12px;min-height:0}
.brand{padding:2px 8px}
.brand b{font-family:var(--display);font-size:19px;font-weight:700;display:block;color:#fff}
.brand span{font-size:12px;color:#B9ACCF}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:#D5C9E6;text-decoration:none;font-weight:500}
.nav a:hover{background:#261739;color:#fff}
.nav a[aria-current="page"]{background:var(--violeta);color:#fff}
.nav .count{margin-left:auto;font-size:12px;background:#2E1D45;border-radius:10px;padding:0 7px;color:#fff}
.nav a[aria-current="page"] .count{background:#4609A0}
.side-foot{margin-top:auto;font-size:12px;color:#B9ACCF;padding:10px 8px;border-top:1px solid #2E1D45}
.side-foot b{color:#fff;font-family:var(--display);font-size:14px;display:block}

/* Área principal */
.main{display:grid;grid-template-rows:auto minmax(0,1fr);min-width:0;min-height:0}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px 18px;background:var(--blanco);border-bottom:1px solid var(--linea)}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--papel);padding:3px;border-radius:9px}
.seg button{border:0;background:transparent;padding:6px 11px;border-radius:7px;font-weight:500;display:flex;align-items:center;gap:7px;color:var(--gris)}
.seg button[aria-pressed="true"]{background:var(--blanco);color:var(--tinta);box-shadow:0 1px 2px rgba(23,13,38,.14)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--gris)}
.dot.ciip{background:var(--ciip)}.dot.geo{background:var(--geo)}.dot.bio{background:var(--bio)}
.demo-tag{font-size:12px;color:var(--gris);margin-left:auto}
.btn{border:1px solid var(--linea);background:var(--blanco);padding:7px 12px;border-radius:8px;font-weight:600;display:inline-flex;align-items:center;gap:7px}
.btn:hover{border-color:var(--violeta)}
.btn.pri{background:var(--violeta);border-color:var(--violeta);color:#fff}
.btn.pri:hover{background:#4A0BA6}
.btn.sim{background:var(--coral);border-color:var(--coral);color:var(--noche)}
.btn.sim:hover{background:#FF8E72}
.btn[disabled]{opacity:.6;cursor:default}
.btn.sm{padding:4px 9px;font-size:13px}
.view{min-height:0;overflow:auto;padding:18px}
.view[hidden]{display:none}
.head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:10px;margin-bottom:14px}
.head p{color:var(--gris);max-width:68ch}
.panel{background:var(--blanco);border:1px solid var(--linea);border-radius:10px}
.pad{padding:14px 16px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:20px;background:var(--papel);color:var(--tinta);white-space:nowrap}
.pill.ia{background:var(--lila);color:#3A0A80}
.pill.hum{background:#FFE3DA;color:#7A2410}
.pill.ok{background:#DDF1E5;color:var(--ok)}
.pill.warn{background:#FBEBCB;color:var(--aviso)}
.muted{color:var(--gris)}
.small{font-size:12px}

/* Bandeja */
#v-bandeja{padding:0;overflow:hidden}
.inbox{display:grid;grid-template-columns:292px minmax(0,1fr) 268px;grid-template-rows:minmax(0,1fr);height:100%;min-height:0}
.hint{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--noche);color:#fff;padding:9px 18px}
.hint p{flex:1 1 280px}
.hint .x{background:none;border:0;color:#D5C9E6;text-decoration:underline;padding:4px}
.inbox.has-hint{grid-template-rows:auto minmax(0,1fr)}
.list{border-right:1px solid var(--linea);background:var(--blanco);overflow:auto;min-height:0}
.conv{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 9px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--linea);background:none;padding:11px 14px;align-items:center}
.conv:hover{background:var(--papel)}
.conv[aria-current="true"]{background:#EFE8F8;box-shadow:inset 3px 0 0 var(--violeta)}
.conv .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv .pv{grid-column:2/4;color:var(--gris);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv .tm{font-size:12px;color:var(--gris)}
.conv .tags{grid-column:2/4;display:flex;gap:5px;flex-wrap:wrap;margin-top:3px}
.chat{display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-height:0;min-width:0}
.chat-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 16px;background:var(--blanco);border-bottom:1px solid var(--linea)}
.chat-head .who{flex:1 1 180px;min-width:0}
.chat-head .who b{font-family:var(--display);font-size:16px}
.msgs{overflow:auto;padding:16px;display:flex;flex-direction:column;gap:8px;background:
  linear-gradient(var(--papel),var(--papel))}
.m{max-width:min(76%,520px);padding:8px 12px;border-radius:12px;white-space:pre-line}
.m .by{display:block;font-size:11px;font-weight:600;margin-bottom:2px;opacity:.8}
.m.lead{align-self:flex-start;background:var(--blanco);border:1px solid var(--linea);border-bottom-left-radius:3px}
.m.ia{align-self:flex-end;background:var(--lila);color:#22103F;border-bottom-right-radius:3px}
.m.human{align-self:flex-end;background:var(--violeta);color:#fff;border-bottom-right-radius:3px}
.m.pay{align-self:flex-end;background:var(--blanco);border:1px solid var(--violeta);border-bottom-right-radius:3px}
.m.pay b{display:block;font-family:var(--display);font-size:18px}
.m.pay .lnk{display:inline-block;margin-top:5px;font-weight:600;color:var(--violeta);text-decoration:underline}
.ev{align-self:center;font-size:12px;color:var(--gris);border:1px dashed #C9BCDD;border-radius:20px;padding:3px 12px;text-align:center;background:var(--blanco);max-width:92%}
.ev.good{border-style:solid;border-color:#9FD3B5;color:var(--ok);background:#EEF8F2;font-weight:600}
.typing{align-self:flex-end;background:var(--lila);border-radius:12px;padding:10px 14px;display:flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:#5C3A99;animation:pt 1s var(--curva) infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes pt{0%,100%{opacity:.25}50%{opacity:1}}
.m,.ev{animation:in .28s var(--curva)}
@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
.composer{background:var(--blanco);border-top:1px solid var(--linea);padding:10px 16px;display:flex;flex-direction:column;gap:8px}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.quick button{border:1px solid var(--linea);background:var(--papel);border-radius:20px;padding:3px 11px;font-size:13px}
.quick button:hover{border-color:var(--violeta)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row select,.row input[type=text],.field input,.field select{border:1px solid #CFC4E0;border-radius:8px;padding:7px 10px;background:var(--blanco);min-width:0}
.row input[type=text]{flex:1 1 180px}
.info{border-left:1px solid var(--linea);background:var(--blanco);overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:14px;min-height:0}
.kv{display:grid;grid-template-columns:1fr;gap:9px}
.kv div span{display:block;font-size:12px;color:var(--gris)}
.kv div b{font-weight:600}
.kv div .pill{display:inline-flex;width:max-content;color:var(--ok)}
.score{height:8px;background:var(--papel);border-radius:4px;overflow:hidden;margin-top:4px}
.score i{display:block;height:100%;background:var(--violeta);border-radius:4px;transition:width .5s var(--curva)}
.note{font-size:12px;color:var(--gris);border-top:1px solid var(--linea);padding-top:10px}

/* Embudo */
.board{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.col{background:#EDE7F5;border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:8px;min-height:340px}
.col.over{outline:2px dashed var(--violeta);outline-offset:-2px}
.col-h{display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px}
.col-h b{font-family:var(--display)}
.card{background:var(--blanco);border:1px solid var(--linea);border-radius:8px;padding:9px 10px;display:flex;flex-direction:column;gap:5px;cursor:grab}
.card.fresh{border-color:var(--coral);box-shadow:0 0 0 2px #FFD9CF}
.card .t{display:flex;align-items:center;gap:7px;font-weight:600}
.card select{border:1px solid var(--linea);border-radius:6px;padding:2px 4px;font-size:12px;background:var(--papel);max-width:100%}

/* Agentes y tablas */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.grid2.wide{grid-template-columns:repeat(auto-fit,minmax(min(400px,100%),1fr))}
.agent{border-top:4px solid var(--gris)}
.agent.ciip{border-top-color:var(--ciip)}.agent.geo{border-top-color:var(--geo)}.agent.bio{border-top-color:var(--bio)}
.field{display:flex;flex-direction:column;gap:3px;margin-top:10px}
.field label{font-size:12px;color:var(--gris);font-weight:600}
.preview{background:var(--lila);color:#22103F;border-radius:10px;padding:8px 11px;margin-top:10px;font-size:13px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--linea);vertical-align:middle}
th{font-size:12px;color:var(--gris);font-weight:600;background:#FAF8FC}
td.r,th.r{text-align:right}
td input{width:84px;border:1px solid #CFC4E0;border-radius:6px;padding:4px 6px;text-align:right}
tr:last-child td{border-bottom:0}

/* Automatizaciones */
.flows{display:grid;grid-template-columns:260px minmax(0,1fr);gap:12px}
.flows>*{min-width:0}
.flow-list{display:flex;flex-direction:column;gap:8px}
.flow-item{align-items:flex-start;text-align:left;border:1px solid var(--linea);background:var(--blanco);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.flow-item[aria-pressed="true"]{border-color:var(--violeta);box-shadow:inset 3px 0 0 var(--violeta)}
.canvas{padding:18px;display:flex;flex-direction:column;align-items:center;gap:0;overflow-x:auto}
.node{border:1px solid var(--linea);border-radius:8px;background:var(--blanco);padding:8px 12px;min-width:220px;max-width:300px;display:flex;gap:9px;align-items:center}
.node small{display:block;font-size:11px;color:var(--gris);font-weight:600}
.node.trig{background:var(--noche);color:#fff;border-color:var(--noche)}
.node.trig small{color:#C9BCDD}
.node.cond{background:var(--lila);border-color:#C3AEE0;border-radius:22px;justify-content:center;text-align:center}
.node input{width:52px;border:1px solid #CFC4E0;border-radius:6px;padding:2px 5px;text-align:right}
.node .rm{margin-left:auto;border:0;background:none;color:var(--gris);font-size:16px;line-height:1;padding:2px 4px}
.wire{width:2px;height:18px;background:#C3AEE0}
.branches{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;border-top:2px solid #C3AEE0;padding-top:0;margin-top:0}
.branch{display:flex;flex-direction:column;align-items:center}
.branch>.lbl{font-size:12px;font-weight:700;margin:6px 0;padding:1px 10px;border-radius:20px}
.branch.si>.lbl{background:#DDF1E5;color:var(--ok)}
.branch.no>.lbl{background:#FBEBCB;color:var(--aviso)}
.add{display:flex;gap:6px;margin-top:8px}
.add select{border:1px dashed #B9A6D6;border-radius:8px;padding:5px 8px;background:var(--blanco);max-width:190px}

/* Panel */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi b{font-family:var(--display);font-size:28px;font-weight:700;display:block;line-height:1.1}
.kpi span{font-size:12px;color:var(--gris)}
.bars{display:grid;grid-template-columns:minmax(96px,auto) minmax(0,1fr) auto;gap:8px 10px;align-items:center;margin-top:12px}
.bars .lb{display:flex;align-items:center;gap:7px;font-size:13px}
.bar{height:16px;background:var(--papel);border-radius:0 4px 4px 0}
.bar i{display:block;height:100%;border-radius:0 4px 4px 0;background:var(--violeta);min-width:2px;transition:width .5s var(--curva)}
.bar i.ciip{background:var(--ciip)}.bar i.geo{background:var(--geo)}.bar i.bio{background:var(--bio)}
.bars .v{font-weight:600;text-align:right}
.barrow{display:contents}
.barrow:hover .bar{background:#E9E1F3}

.toast{position:fixed;right:16px;bottom:16px;background:var(--noche);color:#fff;padding:10px 14px;border-radius:10px;max-width:340px;box-shadow:0 6px 20px rgba(23,13,38,.3);transform:translateY(20px);opacity:0;transition:transform .3s var(--curva),opacity .3s var(--curva);pointer-events:none;z-index:5}
.toast.on{transform:none;opacity:1}

@media (max-width:900px){
  html,body{height:auto}
  body{display:block}
  .side{flex-direction:row;align-items:center;gap:10px;padding:8px 12px;overflow-x:auto;position:sticky;top:0;z-index:3}
  .brand span,.side-foot{display:none}
  .nav{flex-direction:row}
  .nav a{white-space:nowrap;padding:7px 10px}
  .nav .count{display:none}
  .main{display:block}
  .top{padding:10px 16px}
  .demo-tag{margin-left:0;flex-basis:100%}
  .view{overflow:visible;padding:16px}
  #v-bandeja{overflow:visible}
  .inbox{display:block;height:auto}
  .list{max-height:232px;border-right:0;border-bottom:1px solid var(--linea)}
  .msgs{height:420px}
  .info{border-left:0;border-top:1px solid var(--linea)}
  .flows{grid-template-columns:minmax(0,1fr)}
  .branches{gap:8px;width:100%}
  .canvas{padding:14px 10px}
  .node{min-width:0;max-width:100%}
  .add select{max-width:150px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .typing i{opacity:.7}
}
</style>

<body>

<aside class="side">
  <div class="brand"><b>CGB Academy</b><span>CRM comercial</span></div>
  <nav class="nav" id="nav" aria-label="Secciones"></nav>
  <div class="side-foot"><b>AGAPAI</b>Demo de propuesta preparada para CGB Academy. Todos los datos son de ejemplo.</div>
</aside>

<div class="main">
  <header class="top">
    <div class="seg" id="instSeg" role="group" aria-label="Institución"></div>
    <span class="demo-tag">Demo interactiva. Nombres, precios y cifras de ejemplo.</span>
    <button class="btn sim" id="simBtn" type="button"></button>
  </header>

  <section class="view" id="v-bandeja" data-view="bandeja"></section>
  <section class="view" id="v-embudo" data-view="embudo" hidden></section>
  <section class="view" id="v-agentes" data-view="agentes" hidden></section>
  <section class="view" id="v-conocimiento" data-view="conocimiento" hidden></section>
  <section class="view" id="v-automatizaciones" data-view="automatizaciones" hidden></section>
  <section class="view" id="v-panel" data-view="panel" hidden></section>
  <section class="view" id="v-cuentas" data-view="cuentas" hidden></section>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ---------- utilidades ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const usd = n => "USD " + Number(n).toLocaleString("es-CO", n % 1 ? {minimumFractionDigits: 2, maximumFractionDigits: 2} : {maximumFractionDigits: 0});
const ICON = {
  bandeja:'<path d="M3 13l3-8h12l3 8v6H3z"/><path d="M3 13h5l1 3h6l1-3h5"/>',
  embudo:'<rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="10" rx="1"/><rect x="17" y="4" width="4" height="6" rx="1"/>',
  agentes:'<rect x="5" y="8" width="14" height="11" rx="2"/><path d="M12 8V4M9 13v2M15 13v2M2 13v3M22 13v3"/>',
  conocimiento:'<path d="M4 5a2 2 0 012-2h13v16H6a2 2 0 00-2 2z"/><path d="M4 19V5M9 8h6"/>',
  automatizaciones:'<circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="12" r="2.5"/><circle cx="6" cy="18" r="2.5"/><path d="M8.5 6H13a3 3 0 013 3v.5M8.5 18H13a3 3 0 003-3v-.5"/>',
  panel:'<path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/>',
  cuentas:'<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/>',
  play:'<path d="M7 5l12 7-12 7z"/>',
  enviar:'<path d="M4 12l16-8-6 16-3-6z"/>'
};
const ic = k => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICON[k]}</svg>`;

/* ---------- datos de ejemplo ---------- */
const VIEWS = [
  ["bandeja","Bandeja"],["embudo","Embudo"],["agentes","Agentes IA"],["conocimiento","Base de conocimiento"],
  ["automatizaciones","Automatizaciones"],["panel","Panel de ventas"],["cuentas","Números y usuarios"]
];
const STAGES = [["nuevo","Nuevo"],["calificado","Calificado"],["propuesta","Propuesta enviada"],["pago","Pago pendiente"],["inscrito","Inscrito"]];
const stageName = id => STAGES.find(s => s[0] === id)[1];
const S = {
  view:"bandeja", inst:"todas", sel:null, typing:null, sim:false, speed:1, writeAs:"lead", flow:"f1", hint:true, fresh:null,
  insts:[
    {id:"ciip", name:"CIIP Latam"},
    {id:"geo",  name:"Geomina Latam"},
    {id:"bio",  name:"Biomedic Learning"}
  ],
  agents:{
    ciip:{name:"Camila", tone:"cercano"},
    geo: {name:"Mateo",  tone:"tecnico"},
    bio: {name:"Valeria",tone:"formal"}
  },
  programs:[
    {id:"gp",  inst:"ciip", name:"Diplomado en Gestión de Proyectos", type:"Diplomado", hours:120, price:320, promo:15, cert:"certificado digital verificable"},
    {id:"pbi", inst:"ciip", name:"Curso de Power BI para Ingeniería", type:"Curso", hours:40, price:95, promo:0, cert:"constancia de participación"},
    {id:"gm",  inst:"geo",  name:"Diplomado en Geología de Minas", type:"Diplomado", hours:140, price:380, promo:10, cert:"certificado digital verificable"},
    {id:"m3d", inst:"geo",  name:"Curso de Modelamiento Geológico 3D", type:"Curso", hours:48, price:140, promo:0, cert:"constancia de participación"},
    {id:"ic",  inst:"bio",  name:"Diplomado en Ingeniería Clínica", type:"Diplomado", hours:130, price:350, promo:12, cert:"certificado digital verificable"},
    {id:"meb", inst:"bio",  name:"Curso de Mantenimiento de Equipos Biomédicos", type:"Curso", hours:45, price:120, promo:0, cert:"constancia de participación"}
  ],
  users:[
    {id:"u1", name:"Gerencia CGB", role:"Administrador", scope:"Todas las instituciones"},
    {id:"u2", name:"Supervisión comercial", role:"Supervisor", scope:"Todas las instituciones"},
    {id:"u3", name:"Andrea Ruiz", role:"Asesora", scope:"CIIP Latam, Biomedic Learning"},
    {id:"u4", name:"Luis Cárdenas", role:"Asesor", scope:"Geomina Latam"}
  ],
  numbers:[
    {inst:"ciip", label:"Ventas CIIP", num:"•••• 410", state:"Conectado", tpl:6},
    {inst:"ciip", label:"Soporte CIIP", num:"•••• 388", state:"Conectado", tpl:3},
    {inst:"geo",  label:"Ventas Geomina", num:"•••• 725", state:"Conectado", tpl:5},
    {inst:"bio",  label:"Ventas Biomedic", num:"•••• 904", state:"Conectado", tpl:4}
  ],
  flows:[
    {id:"f1", name:"Lead nuevo desde Meta Ads", on:true,
      pre:[["trig","Disparador","Lead nuevo de Meta Ads o formulario"],["act","Acción","Registrar consentimiento (opt-in)"],["act","Agente IA","Saludar, informar y calificar"]],
      cond:"¿Score de calificación de 70 o más?",
      si:[["act","Agente IA","Enviar propuesta y link de pago"],["act","Integración","Esperar confirmación de la pasarela"],["act","Integración","Matricular en la plataforma educativa"]],
      no:[["act","Acción","Etiquetar como «Nutrir»"],["wait","Esperar",72],["act","Plantilla","Enviar contenido del programa"]]},
    {id:"f2", name:"Recordatorio de pago pendiente", on:true,
      pre:[["trig","Disparador","Link de pago enviado"],["wait","Esperar",24]],
      cond:"¿La pasarela confirmó el pago?",
      si:[["act","Acción","Mover a «Inscrito» y avisar al asesor"]],
      no:[["act","Plantilla","Enviar recordatorio de pago"],["wait","Esperar",48],["act","Acción","Transferir a un asesor humano"]]},
    {id:"f3", name:"Recuperación de prospectos", on:true,
      pre:[["trig","Disparador","Sin respuesta en «Propuesta enviada»"],["wait","Esperar",72],["act","Plantilla","Enviar mensaje de recuperación"]],
      cond:"¿El prospecto respondió?",
      si:[["act","Agente IA","Retomar la conversación"]],
      no:[["act","Acción","Etiquetar como «Frío»"]]}
  ],
  leads:[]
};
const inst = id => S.insts.find(i => i.id === id);
const prog = id => S.programs.find(p => p.id === id);
const user = id => S.users.find(u => u.id === id);
const finalPrice = p => Math.round(p.price * (100 - p.promo)) / 100;
const first = n => n.split(" ")[0];
const advisorFor = iid => S.users.find(x => x.role.startsWith("Asesor") && x.scope.includes(inst(iid).name));
const ownerLabel = L => L.owner === "ia" ? "Agente IA · " + S.agents[L.inst].name : user(L.owner).name;

/* ---------- textos del agente (usan la base de conocimiento en vivo) ---------- */
const T = {
  greet(L){
    const a = S.agents[L.inst], i = inst(L.inst).name, n = first(L.name);
    if (a.tone === "formal") return `Buen día, ${n}. Le saluda ${a.name}, de ${i}.`;
    if (a.tone === "tecnico") return `Hola, ${n}. Soy ${a.name}, del área académica de ${i}.`;
    return `¡Hola, ${n}! Soy ${a.name}, de ${i}.`;
  },
  info(L){ const p = prog(L.prog);
    return `${T.greet(L)}\nEl ${p.name} dura ${p.hours} horas, es virtual y al terminar recibes ${p.cert}.\n¿A qué te dedicas y qué buscas lograr con el programa?`; },
  price(L){ const p = prog(L.prog);
    return p.promo > 0
      ? `La inversión es de ${usd(p.price)}. Este mes tiene ${p.promo} % de descuento y queda en ${usd(finalPrice(p))}.\n¿Te envío el link de pago?`
      : `La inversión es de ${usd(p.price)}.\n¿Te envío el link de pago?`; },
  objection(L){ const p = prog(L.prog);
    return `Entiendo. Puedes pagarlo en 2 cuotas de ${usd(Math.round(finalPrice(p) * 50) / 100)} sin recargo y conservas el precio de hoy.\n¿Te sirve así?`; },
  cert(L){ const p = prog(L.prog); return `Sí. Al aprobar el ${p.name} recibes ${p.cert}, con ${p.hours} horas académicas.`; },
  schedule(L){ const p = prog(L.prog); return `Son ${p.hours} horas en modalidad virtual. Las clases quedan grabadas para que avances a tu ritmo.`; },
  confirm(L){ const p = prog(L.prog); return `Pago confirmado. Ya tienes matrícula en el ${p.name}.\nTe envié el acceso al aula virtual. Si necesitas algo, escríbeme por aquí.`; },
  unknown(){ return "Puedo contarte sobre el precio, la certificación, la duración o enviarte el link de pago. ¿Qué te gustaría saber?"; }
};

/* ---------- semilla de conversaciones ---------- */
let seq = 0;
function seedLead(name, instId, progId, stage, score, source, owner, last){
  const L = {id:"L" + (++seq), name, inst:instId, prog:progId, stage, score, source, owner, last, msgs:[]};
  const rank = STAGES.findIndex(s => s[0] === stage), p = prog(progId);
  L.msgs.push({from:"event", text:`Lead recibido desde ${source} · opt-in registrado`});
  L.msgs.push({from:"lead", text:`Hola, quiero información del ${p.name}.`});
  L.msgs.push({from:"ia", text:T.info(L)});
  if (rank >= 1){
    L.msgs.push({from:"lead", text:"Trabajo en el sector y quiero crecer profesionalmente. ¿Cuánto cuesta?"});
    L.msgs.push({from:"event", text:`Calificado por el agente · score ${score}`});
  }
  if (owner !== "ia"){

let toastT;
function toast(t){ const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("on"), 3600); }
const wait = ms => new Promise(r => setTimeout(r, ms * S.speed));
function setStage(L, st){ L.stage = st; L.last = "ahora"; }
function push(L, m){ L.msgs.push(m); L.last = "ahora"; S.leads.splice(S.leads.indexOf(L), 1); S.leads.unshift(L); }
async function iaSay(L, text, extra){
  S.typing = L.id; render(); await wait(1200);
  S.typing = null;
  if (L.owner !== "ia") { render(); return false; }
  push(L, Object.assign({from:"ia", text}, extra || {})); render(); return true;
}
function sendPay(L){ const p = prog(L.prog); push(L, {from:"pay", amount:finalPrice(p), text:p.name}); setStage(L, "pago"); }
async function payApproved(L){
  await wait(1700);
  push(L, {from:"event", good:true, text:"Pasarela de pago: transacción aprobada"}); setStage(L, "inscrito"); render();
  await wait(600);
  push(L, {from:"event", text:"Matrícula creada en la plataforma educativa"}); render();
  if (L.owner === "ia") await iaSay(L, T.confirm(L));
}
const NAMES = ["Valentina Cruz","Mateo Herrera","Gabriela Soto","Fernando Aguilar","Lorena Campos","Ricardo Núñez"];
let simN = 0;
async function runSim(instId){
  if (S.sim) return;
  const order = ["geo","ciip","bio"];
  const iid = instId || (S.inst !== "todas" ? S.inst : order[simN % 3]);
  const p = S.programs.find(x => x.inst === iid && x.type === "Diplomado");
  const L = {id:"L" + (++seq), name:NAMES[simN++ % NAMES.length], inst:iid, prog:p.id, stage:"nuevo", score:0, source:"Meta Ads", owner:"ia", last:"ahora", msgs:[]};
  S.leads.unshift(L); S.sim = L.id; S.sel = L.id; S.fresh = L.id; S.hint = false;
  if (S.inst !== "todas" && S.inst !== iid) S.inst = iid;
  if (S.view !== "embudo" && S.view !== "panel") go("bandeja");
  const leadSay = async t => { await wait(1300); push(L, {from:"lead", text:t}); render(); };
  const alive = () => L.owner === "ia";
  try {
    push(L, {from:"event", text:`Lead recibido desde Meta Ads · campaña «${p.name}» · opt-in registrado`}); render();
    await leadSay("Hola, vi el anuncio del diplomado. ¿Me dan información?");
    if (!(await iaSay(L, T.info(L)))) return;
    await leadSay("Soy profesional del área y quiero ascender en mi empresa. ¿Cuánto cuesta?");
    L.score = 82; setStage(L, "calificado");
    push(L, {from:"event", text:"Calificado por el agente · perfil afín, interés alto · score 82"}); render();
    if (!(await iaSay(L, T.price(L)))) return;
    setStage(L, "propuesta"); render();
    await leadSay("Me interesa, pero está un poco caro para pagarlo de una.");
    if (!alive()) return;
    push(L, {from:"event", text:"Objeción detectada: precio"}); render();
    if (!(await iaSay(L, T.objection(L)))) return;
    await leadSay("En dos cuotas sí puedo. Envíame el link.");
    if (!alive()) return;
    S.typing = L.id; render(); await wait(900); S.typing = null;
    if (!alive()) return;
    sendPay(L); render();
    await payApproved(L);
    toast(`${L.name} quedó inscrito. Revisa el embudo y el panel de ventas.`);
  } finally { S.sim = false; S.typing = null; render(); }
}
async function replyTo(L, text){
  const t = text.toLowerCase();
  if (L.owner !== "ia") return;
  if (/asesor|humano|persona|llam/.test(t)){
    const u = advisorFor(L.inst);
    await wait(700); L.owner = u.id;
    push(L, {from:"event", text:`Transferida a ${u.name} · motivo: el prospecto pidió un asesor`}); render();
    toast(`Conversación asignada a ${u.name}.`); return;
  }
  if (/link|pagar|pago|inscrib|matric|compr/.test(t)){
    S.typing = L.id; render(); await wait(900); S.typing = null;
    if (L.owner !== "ia") { render(); return; }
    if (!L.score) L.score = 75;
    sendPay(L); render(); await payApproved(L); return;
  }
  let out;
  if (/caro|descuento|rebaj|promo|cuota/.test(t)) { out = T.objection(L); push(L, {from:"event", text:"Objeción detectada: precio"}); }
  else if (/cu[aá]nto|precio|cuesta|costo|valor|inversi/.test(t)) { out = T.price(L); if (!L.score) L.score = 70; if (["nuevo","calificado"].includes(L.stage)) setStage(L, "propuesta"); }
  else if (/certific|diploma|t[ií]tulo|constancia/.test(t)) out = T.cert(L);
  else if (/hora|dura|cu[aá]ndo|inicio|empie|modalidad|clase/.test(t)) out = T.schedule(L);
  else out = T.unknown();
  await iaSay(L, out);
}
function sendMsg(text){
  const L = lead(S.sel); if (!L || !text.trim() || S.sim === L.id) return;
  if (S.writeAs === "human"){
    if (L.owner === "ia"){ const u = advisorFor(L.inst); L.owner = u.id; push(L, {from:"event", text:`${u.name} tomó la conversación`}); }
    push(L, {from:"human", text:text.trim()}); render();
  } else { push(L, {from:"lead", text:text.trim()}); render(); replyTo(L, text); }
}
function runRecovery(){
  const f = S.flows.find(x => x.id === "f3");
  if (!f.on) { toast("El flujo está apagado. Enciéndelo para ejecutarlo."); return; }
  const ls = S.leads.filter(L => L.stage === "propuesta");
  ls.slice().reverse().forEach(L => { push(L, {from:"event", text:"Automatización: plantilla de recuperación enviada"}); push(L, {from: L.owner === "ia" ? "ia" : "human", by:"Plantilla aprobada", text:`Hola, ${first(L.name)}. ¿Sigues interesado en el ${prog(L.prog).name}? Te guardamos el precio hasta el viernes.`}); });
  render(); toast(ls.length ? `Se enviaron ${ls.length} mensajes de recuperación. Míralos en la bandeja.` : "No hay prospectos en «Propuesta enviada».");
}
function go(v){ if (!VIEWS.some(x => x[0] === v)) v = "bandeja"; S.view = v; if (location.hash !== "#" + v){ try { history.replaceState(null, "", "#" + v); } catch (e) { location.hash = v; } } }

/* ---------- eventos ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-inst],[data-lead],[data-act],[data-quick],[data-test],[data-flow],[data-rm],#simBtn,#nav a");
  if (!t) return;
  if (t.matches("#nav a")) { e.preventDefault(); go(t.getAttribute("href").slice(1)); return render(); }
  if (t.id === "simBtn") return void runSim();
  if (t.dataset.inst) { S.inst = t.dataset.inst; return render(); }
  if (t.dataset.lead) { S.sel = t.dataset.lead; return render(); }
  if (t.dataset.quick) { S.writeAs = "lead"; return sendMsg(t.dataset.quick); }
  if (t.dataset.test) { return void runSim(t.dataset.test); }
  if (t.dataset.flow) { S.flow = t.dataset.flow; return render(); }
  if (t.dataset.rm) { const [w, i] = t.dataset.rm.split(":"); S.flows.find(x => x.id === S.flow)[w].splice(+i, 1); return render(); }
  const a = t.dataset.act, L = lead(S.sel);
  if (a === "hint") S.hint = false;
  if (a === "take" && L) { const u = advisorFor(L.inst); L.owner = u.id; push(L, {from:"event", text:`${u.name} tomó la conversación · el agente IA queda en pausa`}); S.writeAs = "human"; }
  if (a === "giveback" && L) { L.owner = "ia"; push(L, {from:"event", text:"Conversación devuelta al agente IA"}); S.writeAs = "lead"; }
  if (a === "toggleflow") { const f = S.flows.find(x => x.id === S.flow); f.on = !f.on; toast(`Flujo «${f.name}» ${f.on ? "encendido" : "apagado"}.`); }
  if (a === "runrec") return runRecovery();
  render();
});
document.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.id === "composer"){ const i = $("#msg"), v = i.value; i.value = ""; sendMsg(v); }
  if (e.target.id === "addNum"){
    const label = $("#nLabel").value.trim();
    if (!label) { toast("Escribe un nombre para la línea."); $("#nLabel").focus(); return; }
    S.numbers.push({inst:$("#nInst").value, label, num:"•••• " + (100 + S.numbers.length * 37), state:"En verificación", tpl:0});
    render(); toast("Número agregado. En producción, Meta lo verifica antes de activarlo.");
  }
});
document.addEventListener("change", e => {
  const t = e.target, d = t.dataset;
  if (t.id === "writeAs") { S.writeAs = t.value; return; }
  if (d.move) { const L = lead(d.move); setStage(L, t.value); S.fresh = L.id; return render(); }
  if (d.agentTone) { S.agents[d.agentTone].tone = t.value; return render(); }
  if (d.agentName) { S.agents[d.agentName].name = t.value.trim() || "Agente"; return render(); }
  if (d.price) { prog(d.price).price = Math.max(0, +t.value || 0); return render(); }
  if (d.promo) { prog(d.promo).promo = Math.min(90, Math.max(0, +t.value || 0)); return render(); }
  if (d.wait) { const [w, i] = d.wait.split(":"); S.flows.find(x => x.id === S.flow)[w][+i][2] = Math.max(1, +t.value || 1); return; }
  if (d.add && t.value){
    const map = {tpl:["act","Plantilla","Enviar plantilla aprobada"], wait:["wait","Esperar",24], notify:["act","Acción","Notificar a un asesor"], tag:["act","Acción","Etiquetar prospecto"]};
    S.flows.find(x => x.id === S.flow)[d.add].push(map[t.value]); return render();
  }
});
/* arrastrar y soltar en el embudo */
let dragId = null;
document.addEventListener("dragstart", e => { const c = e.target.closest && e.target.closest("[data-card]"); if (c) { dragId = c.dataset.card; e.dataTransfer.effectAllowed = "move"; try { e.dataTransfer.setData("text/plain", dragId); } catch (x) {} } });
document.addEventListener("dragover", e => { const c = e.target.closest && e.target.closest(".col"); if (c && dragId) { e.preventDefault(); c.classList.add("over"); } });
document.addEventListener("dragleave", e => { const c = e.target.closest && e.target.closest(".col"); if (c && !c.contains(e.relatedTarget)) c.classList.remove("over"); });
document.addEventListener("drop", e => { const c = e.target.closest && e.target.closest(".col"); if (c && dragId) { e.preventDefault(); const L = lead(dragId); setStage(L, c.dataset.stage); S.fresh = L.id; dragId = null; render(); } });
document.addEventListener("dragend", () => { dragId = null; });
window.addEventListener("hashchange", () => { go(location.hash.slice(1)); render(); });

window.DEMO = {S, runSim, go, render};
go(location.hash.slice(1) || "bandeja");
render();
</script>
</body>
